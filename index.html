<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N2 แฟลชการ์ด</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mu:#76746d;--bd:#e3e0d8;--ac:#c2410c;--ok:#15803d;--no:#b91c1c;--bar:#e3e0d8}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--card:#222220;--tx:#f2f0ea;--mu:#a09d94;--bd:#3a3935;--ac:#fb923c;--ok:#4ade80;--no:#f87171;--bar:#3a3935}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Noto Sans Thai","Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:520px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mu)}
.bar{height:6px;background:var(--bar);border-radius:3px;margin:8px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 18px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.cat{font-size:12px;color:var(--mu)}
.word{font-size:44px;font-weight:600;line-height:1.2;word-break:break-all}
.rd{font-size:22px;color:var(--ac)}
.mn{font-size:20px}
.ex{font-size:16px;color:var(--mu);border-top:1px dashed var(--bd);padding-top:10px;margin-top:4px}
.hid{display:none}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:14px;cursor:pointer}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1}
.big{width:100%;background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600;margin-top:12px}
.ok{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600}
.no{background:var(--no);color:#fff;border-color:var(--no);font-weight:600}
.sp{background:none;border:none;font-size:22px;padding:4px;margin:0 auto}
.set{margin-top:22px;font-size:14px;color:var(--mu)}
.set select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.set .row button{padding:10px;font-size:14px}
.set label{display:block;margin:8px 0 4px}
.done{text-align:center;padding:40px 10px}
.fm input,.fm textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);margin-top:6px}
.fm button{width:100%;margin-top:8px}
.set summary{cursor:pointer;color:var(--ac);font-weight:600;margin-top:12px}
#cl div{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd)}
#cl .cx{width:auto;margin:0;padding:2px 10px}
.sv{font-size:12px;color:var(--mu);margin:-8px 0 6px}
.sv.bad{color:var(--no);font-weight:600}
</style>
</head>
<body>
<div class="w">
  <div class="top"><span id="st"></span><span id="pc"></span></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="sv" id="dt"></div>
  <div class="sv" id="sv"></div>
  <div id="main"></div>
  <div class="set">
    <label>หมวด
      <select id="cat"></select>
    </label>
    <label>ซ่อนคำเมื่อจำได้ติดต่อกัน
      <select id="thr"><option value="1">1 ครั้ง</option><option value="2">2 ครั้ง</option><option value="3">3 ครั้ง</option></select>
    </label>
    <details id="ad"><summary>＋ เพิ่มคำใหม่</summary>
      <div class="fm">
        <input id="fw" placeholder="คำ (日本語) *">
        <input id="fr" placeholder="คำอ่าน">
        <input id="fm" placeholder="คำแปล *">
        <input id="fe" placeholder="ประโยคตัวอย่าง (ไม่ใส่ก็ได้)">
        <input id="fc" placeholder="หมวด (ไม่ใส่ = เพิ่มเอง)">
        <button id="fa" class="big">เพิ่มคำ</button>
        <label>หรือวางหลายคำ: 1 บรรทัด = 1 คำ คั่นด้วย Tab (วางจาก Excel ได้) หรือ |<br>ลำดับ: คำ | คำอ่าน | คำแปล | ประโยค | หมวด</label>
        <textarea id="bt" rows="4"></textarea>
        <button id="ba">นำเข้าหลายคำ</button>
        <div id="am"></div>
        <div id="cl"></div>
      </div>
    </details>
    <div class="row">
      <button id="ex">⬇ Export</button>
      <button id="im">⬆ Import</button>
      <button id="rs">รีเซ็ต</button>
    </div>
    <input type="file" id="fi" accept=".json" class="hid">
  </div>
</div>

const KEY="n2cards_v1";
let S={p:{},thr:2,cat:"",t:0,c:[]};
const ALL=()=>D.concat(S.c||[]);
let okL=false,okD=false;
function probeLS(){try{localStorage.setItem("_t","1");localStorage.removeItem("_t");return true}catch(e){return false}}
try{const t=localStorage.getItem(KEY);if(t)S=Object.assign(S,JSON.parse(t))}catch(e){}
function openDB(cb){try{const r=indexedDB.open("n2db",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>{okD=true;cb(r.result)};r.onerror=()=>cb(null);r.onblocked=()=>cb(null)}catch(e){cb(null)}}
function writeDB(txt){openDB(db=>{if(!db)return;try{db.transaction("k","readwrite").objectStore("k").put(txt,KEY)}catch(e){okD=false}})}
function readDB(cb){openDB(db=>{if(!db)return cb(null);try{const q=db.transaction("k").objectStore("k").get(KEY);q.onsuccess=()=>{try{cb(q.result?JSON.parse(q.result):null)}catch(e){cb(null)}};q.onerror=()=>cb(null)}catch(e){cb(null)}})}
function save(){
  S.t=Date.now();const txt=JSON.stringify(S);
  try{localStorage.setItem(KEY,txt);okL=localStorage.getItem(KEY)===txt}catch(e){okL=false}
  writeDB(txt);
  setTimeout(setSv,300);
}
function setSv(){
  const e=document.getElementById("sv");if(!e)return;const ok=okL||okD;
  e.textContent=ok?"💾 บันทึกอัตโนมัติในเครื่องนี้":"⚠️ เบราว์เซอร์นี้บันทึกไม่ได้ (เปิดจากไฟล์/โหมดส่วนตัว/แอปที่จำกัด) กด Export เก็บไว้ หรือเปิดผ่านลิงก์เว็บ";
  e.className="sv"+(ok?"":" bad");
}
const $=id=>document.getElementById(id);
function fillCats(){
  const cats=[...new Set(ALL().map(x=>x[0]))];
  if(S.cat&&!cats.includes(S.cat))S.cat="";
  $("cat").innerHTML='<option value="">ทุกหมวด</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");
  $("cat").value=S.cat;
}
fillCats();
$("cat").value=S.cat;$("thr").value=S.thr;
let cur=null,last=null;
const P=w=>S.p[w]||(S.p[w]={k:0,s:0});
const pool=()=>ALL().filter(x=>(!S.cat||x[0]===S.cat));
const active=()=>pool().filter(x=>P(x[1]).k<S.thr);
function pick(){
  let a=active();if(!a.length)return null;
  if(a.length>1)a=a.filter(x=>x[1]!==last);
  const ws=a.map(x=>{const p=P(x[1]);return p.k>0?1/Math.pow(2,p.k-1):(p.s?4:3)});
  let r=Math.random()*ws.reduce((s,v)=>s+v,0);
  for(let i=0;i<a.length;i++){r-=ws[i];if(r<=0)return a[i]}
  return a[a.length-1];
}
function stats(){
  const all=pool(),n=all.length;let m=0,g=0,u=0,sum=0;
  all.forEach(x=>{const p=P(x[1]);sum+=Math.min(p.k,S.thr);if(p.k>=S.thr)m++;else if(p.k>0)g++;else if(p.s)u++});
  $("st").textContent=`จำครบ ${m} / ${n} คำ`;
  $("pc").textContent=n?Math.round(sum/(n*S.thr)*100)+"%":"";
  $("pb").style.width=(n?sum/(n*S.thr)*100:0)+"%";
  $("dt").textContent=`กำลังจำ ${g} · ยังไม่จำ ${u} · ยังไม่เคยเจอ ${n-m-g-u}`;
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function render(){
  stats();
  cur=pick();
  if(!cur){
    $("main").innerHTML='<div class="done"><div style="font-size:48px">🎉</div><h2>จบแล้ว!</h2><p>จำครบทุกคำในหมวดนี้แล้ว</p><button class="big" id="again">ทบทวนใหม่ทั้งหมด</button></div>';
    $("again").onclick=()=>{pool().forEach(x=>{P(x[1]).k=0});save();render()};
    return;
  }
  const [c,w,r,m,e]=cur;
  $("main").innerHTML=`<div class="card"><div class="cat">${esc(c)}</div><div class="word">${esc(w)}</div>
  <div id="ans" class="hid"><div class="rd">${esc(r)} <button class="sp" id="spk">🔊</button></div><div class="mn">${esc(m)}</div>${e?`<div class="ex">${esc(e)}</div>`:""}</div></div>
  <button class="big" id="show">แสดงคำ</button>
  <div class="row hid" id="jb"><button class="no" id="bn">ยังไม่จำ ✗</button><button class="ok" id="by">จำได้ ✓</button></div>`;
  $("show").onclick=()=>{$("ans").classList.remove("hid");$("jb").classList.remove("hid");$("show").classList.add("hid")};
  $("spk").onclick=()=>{try{const u=new SpeechSynthesisUtterance(r||w);u.lang="ja-JP";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
  $("by").onclick=()=>answer(true);
  $("bn").onclick=()=>answer(false);
}
function answer(ok){
  const p=P(cur[1]);p.s++;p.k=ok?p.k+1:0;last=cur[1];save();render();
}
$("cat").onchange=e=>{S.cat=e.target.value;save();last=null;render()};
$("thr").onchange=e=>{S.thr=+e.target.value;save();render()};
$("ex").onclick=()=>{
  const b=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download="n2-progress-"+new Date().toISOString().slice(0,10)+".json";a.click();
};
$("im").onclick=()=>$("fi").click();
$("fi").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.p)throw 0;S=Object.assign({p:{},thr:2,cat:""},o);save();fillCats();drawCl();$("thr").value=S.thr;render();alert("นำเข้าสำเร็จ")}catch(x){alert("ไฟล์ไม่ถูกต้อง")}};
  rd.readAsText(f);
};
$("rs").onclick=()=>{if(confirm("ล้างความคืบหน้าทั้งหมด?")){S.p={};save();last=null;render()}};
const clean=s=>(s||"").trim();
function addWords(list){
  const have=new Set(ALL().map(x=>x[1]));
  if(!S.c)S.c=[];
  let ok=0,dup=0,bad=0;
  list.forEach(a=>{
    const w=clean(a[0]),m=clean(a[2]);
    if(!w||!m){bad++;return}
    if(have.has(w)){dup++;return}
    have.add(w);S.c.push([clean(a[4])||"เพิ่มเอง",w,clean(a[1]),m,clean(a[3])]);ok++;
  });
  if(ok){save();fillCats();drawCl();last=null;render()}
  return "เพิ่ม "+ok+" คำ"+(dup?" · ซ้ำ "+dup:"")+(bad?" · ข้อมูลไม่ครบ "+bad:"");
}
function drawCl(){
  const c=S.c||[];
  $("cl").innerHTML=c.length?"<label>คำที่เพิ่มเอง ("+c.length+")</label>"+c.map((x,i)=>`<div><span>${esc(x[1])} · ${esc(x[3])}</span><button class="cx" data-i="${i}">✕</button></div>`).join(""):"";
}
$("cl").onclick=e=>{
  const i=e.target.dataset&&e.target.dataset.i;if(i==null)return;
  const x=S.c[+i];if(!x||!confirm("ลบ "+x[1]+" ?"))return;
  S.c.splice(+i,1);delete S.p[x[1]];save();fillCats();drawCl();last=null;render();
};
$("fa").onclick=()=>{
  const v=["fw","fr","fm","fe","fc"].map(i=>$(i).value);
  const msg=addWords([[v[0],v[1],v[2],v[3],v[4]]]);
  $("am").textContent=msg;
  if(msg.startsWith("เพิ่ม 1 "))["fw","fr","fm","fe"].forEach(i=>$(i).value="");
};
$("ba").onclick=()=>{
  const rows=$("bt").value.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(l.includes("\t")?"\t":"|"));
  const msg=addWords(rows);
  $("am").textContent=msg;
  if(!msg.startsWith("เพิ่ม 0 "))$("bt").value="";
};

okL=probeLS();
drawCl();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
setSv();render();
readDB(o=>{
  if(o&&o.p&&(o.t||0)>(S.t||0)){
    S=Object.assign({p:{},thr:2,cat:"",t:0},o);
    fillCats();drawCl();$("thr").value=S.thr;
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    last=null;render();
  }
  setSv();
});
</script>
</body>
</html>
